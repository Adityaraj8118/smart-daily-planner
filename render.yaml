# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: smart-daily-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker so the daily-reminder thread runs exactly once.
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: COOKIE_SECURE
        value: "1"
      - key: NOTIFY_HOUR
        value: "8"
      # Random values generated by Render once; they keep logins and push working across restarts.
      - key: SECRET_KEY
        generateValue: true
      - key: VAPID_SECRET
        generateValue: true
      # Fill these in the Render dashboard when creating the service.
      - key: DATABASE_URL     # Neon Postgres connection string
        sync: false
      - key: BREVO_API_KEY    # Brevo > SMTP & API > API keys
        sync: false
      - key: MAIL_FROM        # e.g. Smart Daily Planner <you@gmail.com> (must be a verified Brevo sender)
        sync: false
